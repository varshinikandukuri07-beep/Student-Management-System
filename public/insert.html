<!-- To insert student data -->
<!DOCTYPE html>
<html>

<head>
    <title>Insert Student</title>
</head>

<body>

<h1>INSERT STUDENT</h1>

<hr>

<a href="index.html">Home</a> |
<a href="list.html">List Students</a> |
<a href="listOne.html">List Required Student</a> |
<a href="insert.html">Insert Student</a> |
<a href="update.html">Update Student</a> |
<a href="delete.html">Delete Student</a>

<hr>

Student Number
<input type="number" id="sno">

<br><br>

Student Name
<input type="text" id="name">

<br><br>

Age
<input type="number" id="age">

<br><br>

Mobile Number
<input type="text" id="mobile">

<br><br>

Total Marks
<input type="number" id="total">

<br><br>

<button onclick="saveStudent()">Save</button>

<br><br>

<button onclick="location.href='index.html'">
    Home Page
</button>


<script>

function saveStudent()
{

    let sno = document.getElementById("sno").value;
    let name = document.getElementById("name").value;
    let age = document.getElementById("age").value;
    let mobile = document.getElementById("mobile").value;
    let total = document.getElementById("total").value;


    fetch("/students", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            std_id: sno,
            stud_name: name,
            age: age,
            mobile: mobile,
            total: total

        })

    })

    .then(response => response.text())

    .then(message => {

        alert(message);

        location.href = "index.html";

    });

}

</script>

</body>

</html>
