<!-- UPDATE STUDENT DETAILS -->
<!DOCTYPE html>
<html>

<head>
    <title>Update Student</title>
</head>

<body>

<h1>UPDATE STUDENT</h1>

<hr>

<a href="index.html">Home</a> |
<a href="list.html">List Students</a> |
<a href="listOne.html">List Required Student</a> |
<a href="insert.html">Insert Student</a> |
<a href="update.html">Update Student</a> |
<a href="delete.html">Delete Student</a>

<hr>

Student Number
<input type="number" id="sno">

<br><br>

Student Name
<input type="text" id="name">

<br><br>

Age
<input type="number" id="age">

<br><br>

Mobile Number
<input type="text" id="mobile">

<br><br>

Total Marks
<input type="number" id="total">

<br><br>

<button onclick="updateStudent()">Update</button>

<br><br>

<button onclick="location.href='index.html'">
    Home Page
</button>


<script>

function updateStudent()
{

    let sno = document.getElementById("sno").value;
    let name = document.getElementById("name").value;
    let age = document.getElementById("age").value;
    let mobile = document.getElementById("mobile").value;
    let total = document.getElementById("total").value;


    fetch("/students/" + sno, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            stud_name: name,
            age: age,
            mobile: mobile,
            total: total

        })

    })

    .then(response => {

        if (response.ok)
            return response.text();

        return response.text().then(message => {
            throw new Error(message);
        });

    })

    .then(message => {

        alert(message);

        location.href = "index.html";

    })

    .catch(error => {

        alert(error.message);

    });

}

</script>

</body>

</html>
